<div class="row">
  <div class="sirs-field col col-50">
    <label for="label" class="active">Libellé</label>
    <input id="label" type="text" name="label" [(ngModel)]="EOS.objectDoc.libelle"/>
  </div>
  <div class="sirs-field col col-50">
    <label for="damSide" class="active">Type d'ouvrage</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="damSide" class="browser-default"
                name="damSide" [(ngModel)]="EOS.objectDoc.typeOuvrageVoirieId">
                <option *ngFor="let r of EOS.refs.RefOuvrageVoirie | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeOuvrageVoirieId === r.id">
                      {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="damSide" class="browser-default" name="damSide" [(ngModel)]="EOS.objectDoc.typeOuvrageVoirieId">
            <option *ngFor="let r of EOS.refs.RefOuvrageVoirie | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.typeOuvrageVoirieId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
      <select id="damSide" class="browser-default" name="damSide" [(ngModel)]="EOS.objectDoc.typeOuvrageVoirieId">
          <option *ngFor="let r of EOS.refs.RefOuvrageVoirie | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeOuvrageVoirieId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
    </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="damPosition" class="active">Position sur la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damPosition" class="browser-default"
                  name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
                  <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                        {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
              <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.positionId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
            <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                    {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="damSide" class="active">Côté de la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damSide" class="browser-default"
                  name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
                  <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')" [value]="r.id"
                    [selected]="EOS.objectDoc.coteId === r.id">
                    {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damSide" class="browser-default"
            name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.coteId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damSide" class="browser-default"
        name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
          <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
            [ngValue]="r.id"
            [selected]="EOS.objectDoc.coteId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
        </select>
      </div>
  </div>
</div>
