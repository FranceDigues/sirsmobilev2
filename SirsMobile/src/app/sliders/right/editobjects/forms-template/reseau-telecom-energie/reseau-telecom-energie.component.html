<div class="sirs-field">
  <label for="label" class="active">Libellé</label>
  <input id="label" name="label" type="text" [(ngModel)]="EOS.objectDoc.libelle"/>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="resType" class="active">Type de réseau</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="resType" class="browser-default"
                  name="resType" [(ngModel)]="EOS.objectDoc.typeReseauTelecomEnergieId">
                  <option *ngFor="let r of EOS.refs.RefReseauTelecomEnergie | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.typeReseauTelecomEnergieId === r.id">
                        {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="resType" class="browser-default" name="resType" [(ngModel)]="EOS.objectDoc.typeReseauTelecomEnergieId">
              <option *ngFor="let r of EOS.refs.RefReseauTelecomEnergie | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.typeReseauTelecomEnergieId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="resType" class="browser-default" name="resType" [(ngModel)]="EOS.objectDoc.typeReseauTelecomEnergieId">
            <option *ngFor="let r of EOS.refs.RefReseauTelecomEnergie | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.typeReseauTelecomEnergieId === r.id">
                    {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="implantation" class="active">Implantation</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="implantation" class="browser-default"
                  name="implantation" [(ngModel)]="EOS.objectDoc.implantationId">
                  <option *ngFor="let r of EOS.refs.RefImplantation | refSort: EOS.showText('fullName')" [value]="r.id"
                    [selected]="EOS.objectDoc.implantationId === r.id">
                    {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="implantation" class="browser-default"
            name="implantation" [(ngModel)]="EOS.objectDoc.implantationId">
              <option *ngFor="let r of EOS.refs.RefImplantation | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.implantationId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="implantation" class="browser-default"
        name="implantation" [(ngModel)]="EOS.objectDoc.implantationId">
          <option *ngFor="let r of EOS.refs.RefImplantation | refSort: EOS.showText('fullName')"
            [ngValue]="r.id"
            [selected]="EOS.objectDoc.implantationId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
        </select>
      </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="height" class="active">Hauteur</label>
      <input id="height" type="number" name="height" [(ngModel)]="EOS.objectDoc.hauteur"/>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-100">
    <label class="active">Ouvrage télécom. ou énergie associé</label>
    <div class="row sirs-field-multi" *ngFor="let v of EOS.objectDoc.ouvrageTelecomEnergieIds; index as index">
      <div class="col col-75">
        <div *ngIf="EOS.showText('fullName')">
          <select class="browser-default"
                  name="" [(ngModel)]="EOS.objectDoc.ouvrageTelecomEnergieIds[index]">
                  <option *ngFor="let r of EOS.refs.OuvrageTelecomEnergie | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.ouvrageTelecomEnergieIds[index] === r.id">
                        {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                  </option>
          </select>
        </div>
        <div *ngIf="EOS.showText('abstract')">
            <select class="browser-default" name="" [(ngModel)]="EOS.objectDoc.ouvrageTelecomEnergieIds[index]">
                <option *ngFor="let r of EOS.refs.OuvrageTelecomEnergie | refSort: EOS.showText('fullName')"
                        [ngValue]="r.id"
                        [selected]="EOS.objectDoc.ouvrageTelecomEnergieIds[index] === r.id">
                    {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                </option>
            </select>
        </div>
        <div *ngIf="EOS.showText('both')">
          <select class="browser-default" name="" [(ngModel)]="EOS.objectDoc.ouvrageTelecomEnergieIds[index]">
              <option *ngFor="let r of EOS.refs.OuvrageTelecomEnergie | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.ouvrageTelecomEnergieIds[index] === r.id">
                      {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
              </option>
          </select>
        </div>
      </div>
      <div class="col col-25">
        <button class="btn pink waves-effect waves-teal" [disabled]="EOS.objectDoc.ouvrageTelecomEnergieIds.length === 1"
                (click)="EOS.objectDoc.ouvrageTelecomEnergieIds.splice(index, 1)">
            <i class="material-icons center">remove</i>
        </button>
        <button class="btn pink waves-effect waves-teal"
                (click)="EOS.objectDoc.ouvrageTelecomEnergieIds.splice(index + 1, 0, EOS.refs.OuvrageTelecomEnergie[0].id)">
            <i class="material-icons center">add</i>
        </button>
      </div>
    </div>
  </div>
</div>

              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"

                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damSide" class="browser-default"
        name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
          <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
            [ngValue]="r.id"
            [selected]="EOS.objectDoc.coteId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
        </select>
      </div>
  </div>
</div>
