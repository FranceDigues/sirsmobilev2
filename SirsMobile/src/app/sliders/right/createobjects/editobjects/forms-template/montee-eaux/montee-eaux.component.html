<div class="mesures">
  <div class="mesure-labels row">
      <div class="sirs-field col">
          <label class="active">Référence hauteur</label>
      </div>
      <div class="sirs-field col">
          <label class="active">Hauteur</label>
      </div>
      <div class="sirs-field col col-25">
          <!-- Empty -->
      </div>
  </div>
  <div class="mesure-values row" *ngFor="let m of EOS.objectDoc.mesures; index as index">
    <div class="sirs-field col">
      <div *ngIf="EOS.showText('fullName')">
            <select id="width" class="browser-default"
                  name="width" [(ngModel)]="m.referenceHauteurId">
                <option *ngFor="let r of EOS.refs.RefReferenceHauteur | refSort: EOS.showText('fullName')" [value]="r.id"
                [selected]="m.referenceHauteurId === r.id">
                    {{ r.libelle }}
                </option>
            </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="width" class="browser-default"
                name="width" [(ngModel)]="m.referenceHauteurId">
                <option *ngFor="let r of EOS.refs.RefReferenceHauteur | refSort: EOS.showText('fullName')"
                        [value]="r.id"
                        [selected]="m.referenceHauteurId === r.id">
                    {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
          <select id="width" class="browser-default" name="" [(ngModel)]="m.referenceHauteurId">
              <option *ngFor="let r of EOS.refs.RefReferenceHauteur | refSort: EOS.showText('fullName')"
                      [value]="r.id"
                      name="width" [(ngModel)]="m.referenceHauteurId"
                      [selected]="m.referenceHauteurId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
              </option>
          </select>
      </div>
    </div>
    <div class="sirs-field col">
      <input type="number" [(ngModel)]="m.hauteur"/>
    </div>
    <div class="sirs-field col col-25">
      <button class="btn pink waves-effect waves-teal" [disabled]="EOS.objectDoc.mesures.length === 1"
              (click)="EOS.objectDoc.mesures.splice(index, 1)">
          <i class="material-icons center">remove</i>
      </button>
      <button class="btn pink waves-effect waves-teal"
              (click)="EOS.objectDoc.mesures.splice(index + 1, 0, createMeasure())">
          <i class="material-icons center">add</i>
      </button>
    </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="scale" class="active">Echelle limnimétrique</label>
      <div *ngIf="EOS.showText('fullName')">
            <select id="scale" class="browser-default"
                  name="scale" [(ngModel)]="EOS.objectDoc.echelleLimnimetriqueId">
                <option *ngFor="let r of EOS.refs.EchelleLimnimetrique | refSort: EOS.showText('fullName')" [value]="r.id"
                [selected]="EOS.objectDoc.echelleLimnimetriqueId === r.id">
                    {{ r.libelle }}
                </option>
            </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="scale" class="browser-default"
                name="scale" [(ngModel)]="EOS.objectDoc.echelleLimnimetriqueId">
                <option *ngFor="let r of EOS.refs.EchelleLimnimetrique | refSort: EOS.showText('fullName')"
                        [value]="r.id"
                        [selected]="EOS.objectDoc.echelleLimnimetriqueId === r.id">
                    {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
          <select id="scale" class="browser-default" name="" [(ngModel)]="EOS.objectDoc.echelleLimnimetriqueId">
              <option *ngFor="let r of EOS.refs.EchelleLimnimetrique | refSort: EOS.showText('fullName')"
                      [value]="r.id"
                      name="scale" [(ngModel)]="EOS.objectDoc.echelleLimnimetriqueId"
                      [selected]="EOS.objectDoc.echelleLimnimetriqueId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
              </option>
          </select>
      </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="damPosition" class="active">Position sur la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damPosition" class="browser-default"
                  name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
                  <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                        {{ r.libelle }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
              <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.positionId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
            <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                    {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="damSide" class="active">Côté de la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damSide" class="browser-default"
                  name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
                  <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')" [value]="r.id"
                    [selected]="EOS.objectDoc.coteId === r.id">
                    {{ r.libelle }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damSide" class="browser-default"
            name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.coteId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damSide" class="browser-default"
        name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
          <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
            [ngValue]="r.id"
            [selected]="EOS.objectDoc.coteId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
        </select>
      </div>
  </div>
</div>
