<div class="row">
  <div class="sirs-field col col-50">
    <label for="label" class="active">Libellé</label>
    <input id="label" type="text" [(ngModel)]="EOS.objectDoc.libelle"/>
  </div>
  <div class="sirs-field col col-50">
      <label for="width" class="active">Largeur</label>
      <input id="width" type="number" [(ngModel)]="EOS.objectDoc.largeur"/>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
    <label for="orientation" class="active">Orientation de l'ouvrage</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="orientation" class="browser-default"
                name="orientation" [(ngModel)]="EOS.objectDoc.orientationOuvrageId">
                <option *ngFor="let r of EOS.refs.RefOrientationOuvrage | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.orientationOuvrageId === r.id">
                      {{ r.libelle }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="orientation" class="browser-default" name="orientation" [(ngModel)]="EOS.objectDoc.orientationOuvrageId">
            <option *ngFor="let r of EOS.refs.RefOrientationOuvrage | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.orientationOuvrageId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
      <select id="orientation" class="browser-default" name="orientation" [(ngModel)]="EOS.objectDoc.orientationOuvrageId">
          <option *ngFor="let r of EOS.refs.RefOrientationOuvrage | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.orientationOuvrageId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
    </div>
  </div>
  <div class="sirs-field col col-50">
    <label for="use" class="active">Usage</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="use" class="browser-default"
                name="use" [(ngModel)]="EOS.objectDoc.usageId">
                <option *ngFor="let r of EOS.refs.RefUsageVoie | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.usageId === r.id">
                      {{ r.libelle }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="use" class="browser-default" name="use" [(ngModel)]="EOS.objectDoc.usageId">
            <option *ngFor="let r of EOS.refs.RefUsageVoie | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.usageId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
      <select id="use" class="browser-default" name="use" [(ngModel)]="EOS.objectDoc.usageId">
          <option *ngFor="let r of EOS.refs.RefUsageVoie | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.usageId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
    </div>
  </div>
</div>
