<div class="row">
  <div class="sirs-field col col-50">
      <label for="categorie" class="active">Catégorie du désordre</label>
      <div *ngIf="EOS.showText('fullName')">
            <select id="categorie" class="browser-default"
                  name="categorie" [(ngModel)]="EOS.objectDoc.categorieDesordreId"
                  (change)="changeCategorie()">
                <option *ngFor="let r of EOS.refs.RefCategorieDesordre | refSort: EOS.showText('fullName')" [value]="r.id"
                [selected]="EOS.objectDoc.categorieDesordreId === r.id">
                    {{ r.libelle }}
                </option>
            </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="categorie" class="browser-default"
                name="categorie" [(ngModel)]="EOS.objectDoc.categorieDesordreId"
                (change)="changeCategorie()">
                <option *ngFor="let r of EOS.refs.RefCategorieDesordre | refSort: EOS.showText('fullName')"
                        [value]="r.id"
                        [selected]="EOS.objectDoc.categorieDesordreId === r.id">
                    {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
          <select id="categorie" class="browser-default" name="" [(ngModel)]="EOS.objectDoc.categorieDesordreId">
              <option *ngFor="let r of EOS.refs.RefCategorieDesordre | refSort: EOS.showText('fullName')"
                      [value]="r.id"
                      name="categorie" [(ngModel)]="EOS.objectDoc.categorieDesordreId"
                      (change)="changeCategorie()"
                      [selected]="EOS.objectDoc.categorieDesordreId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
              </option>
          </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="type" class="active">Type du désordre</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="type" class="browser-default"
                  name="type" [(ngModel)]="EOS.objectDoc.typeDesordreId">
                  <option *ngFor="let r of (filterPipe.transform(EOS.refs.RefTypeDesordre, { categorieId: EOS.objectDoc.categorieDesordreId })) | refSort: EOS.showText('fullName')"
                  [value]="r._id" [selected]="EOS.objectDoc.typeDesordreId === r._id">
                    {{ r.libelle }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="type" class="browser-default" name="type" [(ngModel)]="EOS.objectDoc.typeDesordreId">
              <option *ngFor="let r of (filterPipe.transform(EOS.refs.RefTypeDesordre, { categorieId: EOS.objectDoc.categorieDesordreId })) | refSort: EOS.showText('fullName')"
                      [ngValue]="r._id"
                      [selected]="EOS.objectDoc.typeDesordreId === r._id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
          <select id="type" class="browser-default" name="type" [(ngModel)]="EOS.objectDoc.typeDesordreId">
              <option *ngFor="let r of (filterPipe.transform(EOS.refs.RefTypeDesordre, { categorieId: EOS.objectDoc.categorieDesordreId })) | refSort: EOS.showText('fullName')"
                      [ngValue]="r._id"
                      [selected]="EOS.objectDoc.typeDesordreId === r._id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
              </option>
          </select>
      </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="damPosition" class="active">Position sur la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damPosition" class="browser-default"
                  name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
                  <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                        {{ r.libelle }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
              <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.positionId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
            <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                    {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="damSide" class="active">Côté de la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damSide" class="browser-default"
                  name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
                  <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')" [value]="r.id"
                    [selected]="EOS.objectDoc.coteId === r.id">
                    {{ r.libelle }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damSide" class="browser-default"
            name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.coteId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damSide" class="browser-default"
        name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
          <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
            [ngValue]="r.id"
            [selected]="EOS.objectDoc.coteId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
        </select>
      </div>
  </div>
</div>
