<div class="sirs-field">
  <label for="label" class="active">Libellé</label>
  <input id="label" type="text" [(ngModel)]="EOS.objectDoc.libelle"/>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="width" class="active">Largeur</label>
      <input id="width" type="number" [(ngModel)]="EOS.objectDoc.largeur"/>
  </div>
  <div class="sirs-field col col-50">
      <label for="height" class="active">Hauteur</label>
      <input id="height" type="number" [(ngModel)]="EOS.objectDoc.hauteur"/>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
    <label for="zThreshold" class="active">Z du seuil</label>
    <input id="zThreshold" type="number" [(ngModel)]="EOS.objectDoc.zSeuil"/>
  </div>
  <div class="sirs-field col col-50">
    <label for="thresholdType" class="active">Type de seuil</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="thresholdType" class="browser-default"
                name="thresholdType" [(ngModel)]="EOS.objectDoc.typeSeuilId">
                <option *ngFor="let r of EOS.refs.RefSeuil | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeSeuilId === r.id">
                      {{ r.libelle }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="thresholdType" class="browser-default" name="thresholdType" [(ngModel)]="EOS.objectDoc.typeSeuilId">
            <option *ngFor="let r of EOS.refs.RefSeuil | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.typeSeuilId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
      <select id="thresholdType" class="browser-default" name="thresholdType" [(ngModel)]="EOS.objectDoc.typeSeuilId">
          <option *ngFor="let r of EOS.refs.RefSeuil | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeSeuilId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
    </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
    <label for="slideType" class="active">Type de seuil</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="slideType" class="browser-default"
                name="slideType" [(ngModel)]="EOS.objectDoc.typeGlissiereId">
                <option *ngFor="let r of EOS.refs.RefTypeGlissiere | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeGlissiereId === r.id">
                      {{ r.libelle }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="slideType" class="browser-default" name="slideType" [(ngModel)]="EOS.objectDoc.typeGlissiereId">
            <option *ngFor="let r of EOS.refs.RefTypeGlissiere | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.typeGlissiereId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
      <select id="slideType" class="browser-default" name="slideType" [(ngModel)]="EOS.objectDoc.typeGlissiereId">
          <option *ngFor="let r of EOS.refs.RefTypeGlissiere | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeGlissiereId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
    </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-100">
    <label class="active">Ouvrage de revanche associé</label>
    <div class="row sirs-field-multi" *ngFor="let v of EOS.objectDoc.ouvrageRevancheIds; index as index">
      <div class="col col-75">
        <div *ngIf="EOS.showText('fullName')">
          <select class="browser-default"
                  name="" [(ngModel)]="EOS.objectDoc.ouvrageRevancheIds[index]">
                  <option *ngFor="let r of EOS.refs.OuvrageRevanche | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.ouvrageRevancheIds[index] === r.id">
                        {{ r.libelle }}
                  </option>
          </select>
        </div>
        <div *ngIf="EOS.showText('abstract')">
            <select class="browser-default" name="" [(ngModel)]="EOS.objectDoc.ouvrageRevancheIds[index]">
                <option *ngFor="let r of EOS.refs.OuvrageRevanche | refSort: EOS.showText('fullName')"
                        [ngValue]="r.id"
                        [selected]="EOS.objectDoc.ouvrageRevancheIds[index] === r.id">
                    {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                </option>
            </select>
        </div>
        <div *ngIf="EOS.showText('both')">
          <select class="browser-default" name="" [(ngModel)]="EOS.objectDoc.ouvrageRevancheIds[index]">
              <option *ngFor="let r of EOS.refs.OuvrageRevanche | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.ouvrageRevancheIds[index] === r.id">
                      {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
              </option>
          </select>
        </div>
      </div>
      <div class="col col-25">
        <button class="btn pink waves-effect waves-teal" [disabled]="EOS.objectDoc.ouvrageRevancheIds.length === 1"
                (click)="EOS.objectDoc.ouvrageRevancheIds.splice(index, 1)">
            <i class="material-icons center">remove</i>
        </button>
        <button class="btn pink waves-effect waves-teal"
                (click)="EOS.objectDoc.ouvrageRevancheIds.splice(index + 1, 0, EOS.refs.OuvrageRevanche[0].id)">
            <i class="material-icons center">add</i>
        </button>
      </div>
    </div>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="damPosition" class="active">Position sur la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damPosition" class="browser-default"
                  name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
                  <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                        {{ r.libelle }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
              <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.positionId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damPosition" class="browser-default" name="damPosition" [(ngModel)]="EOS.objectDoc.positionId">
            <option *ngFor="let r of EOS.refs.RefPosition | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.positionId === r.id">
                    {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="damSide" class="active">Côté de la digue</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="damSide" class="browser-default"
                  name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
                  <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')" [value]="r.id"
                    [selected]="EOS.objectDoc.coteId === r.id">
                    {{ r.libelle }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="damSide" class="browser-default"
            name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.coteId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="damSide" class="browser-default"
        name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
          <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
            [ngValue]="r.id"
            [selected]="EOS.objectDoc.coteId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
        </select>
      </div>
  </div>
</div>
