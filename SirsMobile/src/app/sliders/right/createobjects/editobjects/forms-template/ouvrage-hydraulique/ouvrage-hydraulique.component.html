<div class="sirs-field">
  <label for="label" class="active">Libellé</label>
  <input id="label" type="text" [(ngModel)]="EOS.objectDoc.libelle"/>
</div>
<div class="row">
  <div class="sirs-field col col-50">
    <label for="workType" class="active">Type d'ouvrage</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="workType" class="browser-default"
                name="workType" [(ngModel)]="EOS.objectDoc.typeOuvrageHydroAssocieId">
                <option *ngFor="let r of EOS.refs.RefOuvrageHydrauliqueAssocie | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeOuvrageHydroAssocieId === r.id">
                      {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="workType" class="browser-default" name="workType" [(ngModel)]="EOS.objectDoc.typeOuvrageHydroAssocieId">
            <option *ngFor="let r of EOS.refs.RefOuvrageHydrauliqueAssocie | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.typeOuvrageHydroAssocieId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
      <select id="workType" class="browser-default" name="workType" [(ngModel)]="EOS.objectDoc.typeOuvrageHydroAssocieId">
          <option *ngFor="let r of EOS.refs.RefOuvrageHydrauliqueAssocie | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.typeOuvrageHydroAssocieId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
    </div>
  </div>
  <div class="sirs-field col col-50">
    <label class="active">Réseau hydraulique associé</label>
    <div class="row sirs-field-multi" *ngFor="let v of EOS.objectDoc.reseauHydrauliqueFermeIds; index as index">
      <div class="col col-75">
        <div *ngIf="EOS.showText('fullName')">
          <select class="browser-default"
                  name="" [(ngModel)]="EOS.objectDoc.reseauHydrauliqueFermeIds[index]">
                  <option *ngFor="let r of EOS.refs.ReseauHydrauliqueFerme"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.reseauHydrauliqueFermeIds[index] === r.id">
                        {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                  </option>
          </select>
        </div>
        <div *ngIf="EOS.showText('abstract')">
            <select class="browser-default" name="" [(ngModel)]="EOS.objectDoc.reseauHydrauliqueFermeIds[index]">
                <option *ngFor="let r of EOS.refs.ReseauHydrauliqueFerme"
                        [ngValue]="r.id"
                        [selected]="EOS.objectDoc.reseauHydrauliqueFermeIds[index] === r.id">
                    {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                </option>
            </select>
        </div>
        <div *ngIf="EOS.showText('both')">
        <!-- TODO test this pls -->
          <select class="browser-default">
              <option *ngFor="let r of EOS.refs.ReseauHydrauliqueFerme">
              </option>
          </select>
          <select class="browser-default" name="" [(ngModel)]="EOS.objectDoc.reseauHydrauliqueFermeIds[index]">
            <option *ngFor="let r of EOS.refs.ReseauHydrauliqueFerme"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.reseauHydrauliqueFermeIds[index] === r.id">
                    <span *ngIf="!r.abrege">
                      {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                    </span>
            </option>
          </select>
        </div>
      </div>
      <div class="col col-25">
        <button class="btn pink waves-effect waves-teal" [disabled]="EOS.objectDoc.reseauHydrauliqueFermeIds.length === 1"
                (click)="EOS.objectDoc.reseauHydrauliqueFermeIds.splice(index, 1)">
            <i class="material-icons center">remove</i>
        </button>
        <button class="btn pink waves-effect waves-teal"
                (click)="EOS.objectDoc.reseauHydrauliqueFermeIds.splice(index + 1, 0, EOS.refs.ReseauHydrauliqueFerme[0].id)">
            <i class="material-icons center">add</i>
        </button>
      </div>
    </div>
  </div>
</div>
