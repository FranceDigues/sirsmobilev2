<div>
  <div class="sirs-card-action" style="background-color: #0097A7;padding:5px;">
    <a (click)="goBack()" class="btn-flat waves-effect waves-teal">
      <i class="material-icons left">arrow_back</i>Annuler
    </a>
    <button type="button" class="btn pink waves-effect waves-teal right"
    (click)="gallery.deleteAllFiles()">
    <i class="material-icons left">delete_forever</i>Supprimer Tous
  </button>
  </div>
  <div class="row" style="padding-top: 0px;padding-left: 0px;">
    <div class="col col-50" style="padding-left: 0px;border-right: 1px solid cadetblue;">
      <div style="height: 410px;margin-top: 1px;">
        <ion-list style="padding: 0 0 !important;">
          <div *ngFor="let file of gallery.availableFiles">
            <ion-item (click)="gallery.select(file)" [class]="{hb: gallery.fileDoc && file.label === gallery.fileDoc.libelle}">
              <span style="text-overflow:ellipsis">{{ file.label }}</span>
            </ion-item>
          </div>
        </ion-list>
      </div>
    </div>
    <!--Les informations détails d'un fichier-->
    <div *ngIf="gallery.fileDoc" class="col col-50">
      <h5>{{ gallery.fileDoc.libelle }}</h5>
      <button type="button" class="btn waves-effect waves-light" (click)="gallery.open()">
        <i class="material-icons">folder_open</i>&nbsp;Ouvrir
      </button>
      <button type="button" class="btn waves-effect waves-light" (click)="gallery.deleteFile()">
        <i class="material-icons">delete_forever</i>&nbsp;Supprimer
      </button>
      <img class="row col col-50" style="margin-top: 10px;"
      alt="Photo non disponible sur le mobile" [src]="gallery.getPhotoPath()"/>
    </div>
  </div>
</div>
