<div class="row">
  <div class="sirs-field col col-50">
      <label for="heightRef" class="active">Référence hauteur</label>
      <div *ngIf="EOS.showText('fullName')">
            <select id="heightRef" class="browser-default"
                  name="heightRef" [(ngModel)]="EOS.objectDoc.referenceHauteurId">
                <option *ngFor="let r of EOS.refs.RefReferenceHauteur | refSort: EOS.showText('fullName')" [value]="r.id"
                [selected]="EOS.objectDoc.referenceHauteurId === r.id">
                    {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                </option>
            </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="heightRef" class="browser-default"
                name="heightRef" [(ngModel)]="EOS.objectDoc.referenceHauteurId">
                <option *ngFor="let r of EOS.refs.RefReferenceHauteur | refSort: EOS.showText('fullName')"
                        [value]="r.id"
                        [selected]="EOS.objectDoc.referenceHauteurId === r.id">
                    {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
                </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
          <select id="heightRef" class="browser-default" name="" [(ngModel)]="EOS.objectDoc.referenceHauteurId">
              <option *ngFor="let r of EOS.refs.RefReferenceHauteur | refSort: EOS.showText('fullName')"
                      [value]="r.id"
                      name="heightRef" [(ngModel)]="EOS.objectDoc.referenceHauteurId"
                      [selected]="EOS.objectDoc.referenceHauteurId === r.id">
                  {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
              </option>
          </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="height" class="active">Hauteur</label>
      <input id="height" name="height" type="number" [(ngModel)]="EOS.objectDoc.hauteur"/>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
    <label for="height" class="active">Position de la laisse</label>
    <input id="height" name="height" type="text" [(ngModel)]="EOS.objectDoc.positionLaisse"/>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
    <form-template-position-digue></form-template-position-digue>
  </div>
  <div class="sirs-field col col-50">
    <label for="heightRef" class="active">Côté de la digue</label>
    <div *ngIf="EOS.showText('fullName')">
          <select id="damSide" class="browser-default"
                name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')" [value]="r.id"
              [selected]="EOS.objectDoc.coteId === r.id">
                  {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
              </option>
          </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="damSide" class="browser-default"
              name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                      [value]="r.id"
                      [selected]="EOS.objectDoc.coteId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
        <select id="damSide" class="browser-default" name="" [(ngModel)]="EOS.objectDoc.coteId">
            <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                    [value]="r.id"
                    name="damSide" [(ngModel)]="EOS.objectDoc.coteId"
                    [selected]="EOS.objectDoc.coteId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
    </div>
  </div>
</div>
