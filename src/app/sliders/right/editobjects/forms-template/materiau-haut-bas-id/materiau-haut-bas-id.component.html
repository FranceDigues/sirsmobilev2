<div class="sirs-field col col-50">
  <label for="topMaterial" class="active">Matériau haut</label>
  <div *ngIf="EOS.showText('fullName')">
      <select id="topMaterial" class="browser-default"
              name="topMaterial" [(ngModel)]="EOS.objectDoc.materiauHautId">
              <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
              [value]="r.id" [selected]="EOS.objectDoc.materiauHautId === r.id">
                {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
              </option>
      </select>
  </div>
  <div *ngIf="EOS.showText('abstract')">
      <select id="topMaterial" class="browser-default" name="topMaterial" [(ngModel)]="EOS.objectDoc.materiauHautId">
          <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.materiauHautId === r.id">
              {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
          </option>
      </select>
  </div>
  <div *ngIf="EOS.showText('both')">
      <select id="topMaterial" class="browser-default" name="topMaterial" [(ngModel)]="EOS.objectDoc.materiauHautId">
          <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.materiauHautId === r.id">
              {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
  </div>
</div>
