<div class="row">
  <div class="sirs-field col col-50">
    <label for="topMaterial" class="active">Matériau haut</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="topMaterial" class="browser-default"
                name="topMaterial" [(ngModel)]="EOS.objectDoc.materiauHautId">
                <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                [value]="r.id" [selected]="EOS.objectDoc.materiauHautId === r.id">
                  {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="topMaterial" class="browser-default" name="topMaterial" [(ngModel)]="EOS.objectDoc.materiauHautId">
            <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.materiauHautId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
        <select id="topMaterial" class="browser-default" name="topMaterial" [(ngModel)]="EOS.objectDoc.materiauHautId">
            <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.materiauHautId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
    </div>
  </div>
  <div class="sirs-field col col-50">
    <label for="lowMaterial" class="active">Matériau bas</label>
    <div *ngIf="EOS.showText('fullName')">
        <select id="lowMaterial" class="browser-default"
                name="lowMaterial" [(ngModel)]="EOS.objectDoc.materiauBasId">
                <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                [value]="r.id" [selected]="EOS.objectDoc.materiauBasId === r.id">
                  {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="lowMaterial" class="browser-default" name="lowMaterial" [(ngModel)]="EOS.objectDoc.materiauBasId">
            <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.materiauBasId === r.id">
                {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
            </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
        <select id="lowMaterial" class="browser-default" name="lowMaterial" [(ngModel)]="EOS.objectDoc.materiauBasId">
            <option *ngFor="let r of EOS.refs.RefMateriau | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.materiauBasId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
    </div>
  </div>
</div>

<div class="row">
  <div class="sirs-field col col-50">
      <label for="height" class="active">Hauteur de la murette</label>
      <input id="height" type="number" name="height" [(ngModel)]="EOS.objectDoc.hauteurMurette"/>
  </div>
  <div class="sirs-field col col-50">
      <label for="width" class="active">Largeur</label>

</div>
<div class="row">
  <div class="sirs-field col col-50">
    <form-template-position-digue></form-template-position-digue>
  </div>
  <div class="sirs-field col col-50">
    <label for="heightRef" class="active">Côté de la digue</label>
    <div *ngIf="EOS.showText('fullName')">
          <select id="damSide" class="browser-default"
                name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')" [value]="r.id"
              [selected]="EOS.objectDoc.coteId === r.id">
                  {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
              </option>
          </select>
    </div>
    <div *ngIf="EOS.showText('abstract')">
        <select id="damSide" class="browser-default"
              name="damSide" [(ngModel)]="EOS.objectDoc.coteId">
              <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                      [value]="r.id"
                      [selected]="EOS.objectDoc.coteId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
        </select>
    </div>
    <div *ngIf="EOS.showText('both')">
        <select id="damSide" class="browser-default" name="" [(ngModel)]="EOS.objectDoc.coteId">
            <option *ngFor="let r of EOS.refs.RefCote | refSort: EOS.showText('fullName')"
                    [value]="r.id"
                    name="damSide" [(ngModel)]="EOS.objectDoc.coteId"
                    [selected]="EOS.objectDoc.coteId === r.id">
                {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
    </div>
  </div>
</div>
