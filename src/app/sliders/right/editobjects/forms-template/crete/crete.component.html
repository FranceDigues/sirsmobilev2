<div class="row">
  <div class="sirs-field col col-50">
      <form-template-materiau-id></form-template-materiau-id>
  </div>
  <div class="sirs-field col col-50">
      <form-template-nature-id></form-template-nature-id>
  </div>
</div>
<div class="row">
  <div class="sirs-field col col-50">
      <label for="function" class="active">Fonction</label>
      <div *ngIf="EOS.showText('fullName')">
          <select id="function" class="browser-default"
                  name="function" [(ngModel)]="EOS.objectDoc.fonctionId">
                  <option *ngFor="let r of EOS.refs.RefFonction | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.fonctionId === r.id">
                        {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
                  </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('abstract')">
          <select id="function" class="browser-default" name="function" [(ngModel)]="EOS.objectDoc.fonctionId">
              <option *ngFor="let r of EOS.refs.RefFonction | refSort: EOS.showText('fullName')"
                      [ngValue]="r.id"
                      [selected]="EOS.objectDoc.fonctionId === r.id">
                  {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
              </option>
          </select>
      </div>
      <div *ngIf="EOS.showText('both')">
        <select id="function" class="browser-default" name="function" [(ngModel)]="EOS.objectDoc.fonctionId">
            <option *ngFor="let r of EOS.refs.RefFonction | refSort: EOS.showText('fullName')"
                    [ngValue]="r.id"
                    [selected]="EOS.objectDoc.fonctionId === r.id">
                    {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
            </option>
        </select>
      </div>
  </div>
  <div class="sirs-field col col-50">
      <label for="width" class="active">Epaisseur</label>
      <input id="width" name="width" type="number" [(ngModel)]="EOS.objectDoc.epaisseur"/>
  </div>
</div>
