<div class="sirs-field col col-50">
  <label for="topFunction" class="active">Fonction haut</label>
  <div *ngIf="EOS.showText('fullName')">
      <select id="topFunction" class="browser-default"
              name="topFunction" [(ngModel)]="EOS.objectDoc.fonctionHautId">
              <option *ngFor="let r of EOS.refs.RefFonction | refSort: EOS.showText('fullName')"
              [value]="r.id" [selected]="EOS.objectDoc.fonctionHautId === r.id">
                {{ r.libelle ? r.libelle : 'libelle undefined / id:  ' + r.id }}
              </option>
      </select>
  </div>
  <div *ngIf="EOS.showText('abstract')">
      <select id="topFunction" class="browser-default" name="topFunction" [(ngModel)]="EOS.objectDoc.fonctionHautId">
          <option *ngFor="let r of EOS.refs.RefFonction | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.fonctionHautId === r.id">
              {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
          </option>
      </select>
  </div>
  <div *ngIf="EOS.showText('both')">
      <select id="topFunction" class="browser-default" name="topFunction" [(ngModel)]="EOS.objectDoc.fonctionHautId">
          <option *ngFor="let r of EOS.refs.RefFonction | refSort: EOS.showText('fullName')"
                  [ngValue]="r.id"
                  [selected]="EOS.objectDoc.fonctionHautId === r.id">
              {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
          </option>
      </select>
  </div>
</div>
