<label for="type" class="active">Nature</label>
<div *ngIf="EOS.showText('fullName')">
    <select id="type" class="browser-default"
            name="type" [(ngModel)]="EOS.objectDoc.natureId">
            <option *ngFor="let r of EOS.refs.RefNature | refSort: EOS.showText('fullName')"
            [value]="r.id" [selected]="EOS.objectDoc.natureId === r.id">
              {{ r.libelle ? r.libelle : 'labelle undefined / id:  ' + r.id }}
            </option>
    </select>
</div>
<div *ngIf="EOS.showText('abstract')">
    <select id="type" class="browser-default" name="type" [(ngModel)]="EOS.objectDoc.natureId">
        <option *ngFor="let r of EOS.refs.RefNature | refSort: EOS.showText('fullName')"
                [ngValue]="r.id"
                [selected]="EOS.objectDoc.natureId === r.id">
            {{r.abrege ? r.abrege : r.designation + ' : ' + r.libelle}}
        </option>
    </select>
</div>
<div *ngIf="EOS.showText('both')">
    <select id="type" class="browser-default" name="type" [(ngModel)]="EOS.objectDoc.natureId">
        <option *ngFor="let r of EOS.refs.RefNature | refSort: EOS.showText('fullName')"
                [ngValue]="r.id"
                [selected]="EOS.objectDoc.natureId === r.id">
            {{r.abrege ? (r.abrege + ' : ' + r.libelle) : (r.designation + ' : ' + r.libelle)}}
        </option>
    </select>
</div>
