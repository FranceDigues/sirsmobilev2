<div ng-switch="c.activeTab">
  <div ng-switch-when="description">
      <div class="sirs-panel">
          <div class="sirs-field-inline">
              <span class="sirs-field-title">Numéro de désignation : </span>
              <span class="sirs-field-value" [textContent]="detailsObject.selectedObject.designation"></span>
          </div>
      </div>
      <div class="sirs-section">
          <div class="sirs-field">
              <span class="sirs-field-title">Libellé</span>
              <span class="sirs-field-value" [textContent]="detailsObject.selectedObject.libelle"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Largeur</span>
              <span class="sirs-field-value" [textContent]="detailsObject.selectedObject.largeur"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Orientation</span>
              <span class="sirs-field-value" [textContent]="detailsObject.abstract.orientationOuvrage"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Usage</span>
              <span class="sirs-field-value" [textContent]="detailsObject.abstract.usage"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Revêtement</span>
              <span class="sirs-field-value" [textContent]="detailsObject.abstract.revetement"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Type d'ouvrage</span>
              <span class="sirs-field-value" [textContent]="detailsObject.abstract.typeOuvrageFranchissement"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Position haut</span>
              <span class="sirs-field-value" [textContent]="detailsObject.abstract.position"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Position bas</span>
              <span class="sirs-field-value" [textContent]="detailsObject.abstract.positionHaut"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Côté</span>
              <span class="sirs-field-value" [textContent]="detailsObject.abstract.positionBas"></span>
          </div>
          <div class="sirs-field">
              <span class="sirs-field-title">Commentaire</span>
              <span class="sirs-field-value" [textContent]="detailsObject.selectedObject.commentaire"></span>
          </div>
      </div>
  </div>
  <!-- Content / Observations -->
  <div ng-switch-when="observations">
      <observations-generic></observations-generic>
  </div>
  <div ng-switch-when="prestations" style="padding: 5px 10px;">
      <prestations-generic></prestations-generic>
  </div>
  <div ng-switch-when="desordres" style="padding: 5px 10px;">
      <desordres-generic></desordres-generic>
  </div>
</div>
