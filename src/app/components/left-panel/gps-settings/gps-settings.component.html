<ion-header translucent="">
    <ion-toolbar class="header-slide">
        <ion-buttons slot="start">
            <ion-back-button defaultHref="main" (click)="goBack()"></ion-back-button>
        </ion-buttons>
        <ion-title>Paramètres GPS</ion-title>
    </ion-toolbar>
</ion-header>
<ion-content [scrollEvents]="true" fullscreen="" class="scroll-all-content">
    <div class="gps-settings-block">
        <label class="block-title">GPS update timeout : {{geolocationService.updateTimeout}} ms : </label>
        <ion-range [ticks]="true"
                   [snaps]="true"
                   [pin]="true"
                   [(ngModel)]="geolocationService.updateTimeout"
                   [step]="1000"
                   [min]="5000"
                   [max]="60000"></ion-range>

        <label class="block-title">Maximum Age : {{geolocationService.gpsOptions.maximumAge}} ms: </label>
        <ion-range [ticks]="true"
                   [snaps]="true"
                   [pin]="true"
                   [(ngModel)]="geolocationService.gpsOptions.maximumAge"
                   [step]="1000"
                   [min]="1000"
                   [max]="120000"></ion-range>
        <label class="block-title">Timeout : {{geolocationService.gpsOptions.timeout}} ms : </label>
        <ion-range [ticks]="true"
                   [snaps]="true"
                   [pin]="true"
                   [(ngModel)]="geolocationService.gpsOptions.timeout"
                   [step]="1000"
                   [min]="1000"
                   [max]="120000"></ion-range>
        <div class="tgl-block">
            <label class="block-title">enableHighAccuracy : </label>
            <ion-toggle [(ngModel)]="geolocationService.gpsOptions.enableHighAccuracy"></ion-toggle>
        </div>
        <div class="btn-block">
            <ion-button color="medium" (click)="validate()">
                <ion-icon name="checkmark-outline"></ion-icon>
                <span style="margin-left: 10px">Valider</span>
            </ion-button>
        </div>
    </div>

</ion-content>
