<ion-menu swipeGesture="false" side="start" menuId="left-slider" contentId="slide" type="push">
    <left-panel class="full-height"></left-panel>
</ion-menu>

<ion-menu swipeGesture="false" side="end" menuId="right-slider" contentId="slide" type="push">
    <right-panel [slidePath]="pathRightSlide" class="full-height"></right-panel>
</ion-menu>

<div class="map full-height" id="slide">
    <header>
        <nav class="navbar navbar-custom navbar-expand-sm">
            <div class="collapse navbar-collapse" id="navbarToggler">
                <a *ngIf="editionLayerService.editionLayer.getVisible()" class="nav-item">Mode Edition</a>
                <div class="gps-infos" fxLayout="column" fxLayoutAlign="center center" *ngIf="geolocationService.lastGPSUpdate">
                    <span class="gps-text">Précision du signal GPS : {{ geolocationService.gpsAccuracy }}&nbsp;m</span>
                    <span class="gps-text">&nbsp;{{ geolocationService.lastGPSUpdate }}</span>
                </div>
            </div>
            <a *ngIf="geolocationService.isEnabled" class="nav-item nav-link header-icon" (click)="locateMe()">
                <ion-icon name="navigate-outline"></ion-icon>
            </a>
            <a class="nav-item nav-link header-icon" (click)="zoomToCurrentLocation()">
                <ion-icon name="flag-outline"></ion-icon>
            </a>
<!--            <a class="nav-item nav-link header-icon" (click)="refresh()">-->
<!--                <ion-icon name="refresh-outline"></ion-icon>-->
<!--            </a>-->
            <a class="nav-item nav-link header-icon" (click)="logout()">
                <ion-icon name="power-outline"></ion-icon>
            </a>
        </nav>
    </header>

    <div class="map">
        <div id="map" #map></div>
        <div class="left-slider">
            <img src="../../../assets/img/slider1.png" (click)="handleSliderLeft()" alt="Left side slide"/>
        </div>
        <div class="right-slider">
            <img src="../../../assets/img/slider2.png" (click)="handleSliderRight()" alt="Right side slide"/>
        </div>
    </div>
    <ion-fab horizontal="end" vertical="bottom" slot="fixed">
        <ion-fab-button color="secondary">
            <ion-icon name="ellipsis-vertical-outline"></ion-icon>
        </ion-fab-button>
        <ion-fab-list side="start">
            <ion-fab-button color="light">
                <ion-icon name="add" (click)="openObjectsCreate()"></ion-icon>
            </ion-fab-button>
            <ion-fab-button color="light">
                <ion-icon name="analytics-outline" (click)="openShoreLine()"></ion-icon>
            </ion-fab-button>
        </ion-fab-list>
    </ion-fab>
</div>
