<div *ngIf="objectDetails.detailsType === 'objectDetails'" class="full-height full-width">
    <div>
        <ion-toolbar class="header-slide">
            <ion-buttons slot="start">
                <ion-back-button defaultHref="main" (click)="goBack()"></ion-back-button>
            </ion-buttons>
            <ion-title>Détail de l'objet</ion-title>
        </ion-toolbar>
    </div>

    <div class="tabs-striped tabs-top" *ngIf="canShowTab()">
        <ul #tabs class="tabs sirs-nav-tabs" style="display: flex;align-content: center;justify-content: start;">
            <li class="tab sirs-tab">
                <a [ngClass]="{active: activeTab === 'description'}"
                   style="padding: 0 10px;"
                   (click)="setActiveTab('description')">
                    Description
                </a></li>
            <li class="tab sirs-tab" *ngIf="canShowObservationsTab()">
                <a [ngClass]="{active: activeTab === 'observations'}"
                   style="padding: 0 10px;"
                   (click)="setActiveTab('observations')">
                    Observations
                </a></li>
            <li class="tab sirs-tab" *ngIf="canShowPrestationsTab()">
                <a [ngClass]="{active: activeTab === 'prestations'}"
                   style="padding: 0 10px;"
                   (click)="setActiveTab('prestations')">
                    Prestations
                </a></li>
            <li class="tab sirs-tab" *ngIf="canShowDesordresTab()">
                <a [ngClass]="{active: activeTab === 'desordres'}"
                   style="padding: 0 10px;"
                   (click)="setActiveTab('desordres')">
                    Désordres
                </a></li>
        </ul>
    </div>

    <details-content [objectType]="objectType" [activeTab]="activeTab"></details-content>

    <div *ngIf="canShowEditionButtons() && activeTab === 'description'"
         style="position: absolute; bottom: 0; right: 0; display:flex">
        <ion-fab-button color="danger" (click)="editObject()" style="margin: 8px;">
            <ion-icon name="pencil-outline"></ion-icon>
        </ion-fab-button>
        <ion-fab-button *ngIf="!document.valid" color="danger" (click)="removeObject()" style="margin: 8px;">
            <ion-icon name="trash-outline"></ion-icon>
        </ion-fab-button>
    </div>

    <div *ngIf="canAddObservation()">
        <ion-fab vertical="bottom" horizontal="end" slot="fixed">
            <ion-fab-button color="danger" (click)="addObservation()">
                <ion-icon name="add-outline"></ion-icon>
            </ion-fab-button>
        </ion-fab>
    </div>
</div>
<div *ngIf="objectDetails.detailsType === 'observationDetails'" class="full-height full-width">
    <observation-details (detailsTypeChange)="objectDetails.detailsType = 'objectDetails'"></observation-details>
</div>
