<ion-list>
  <ion-item (click)="detailsObject.openObservationDetails(obs)"
            [ngClass]="{'has-photos': obs.photos && obs.photos.length > 0}"
            *ngFor="let obs of detailsObject.selectedObject.observations">
      <span *ngIf="obs.date">{{ obs.date|date:'dd/MM/yyyy' }}</span>
      <span *ngIf="!obs.date && obs.designation">{{ obs.designation }}</span>
      <span *ngIf="!obs.date && !obs.designation && obs.id">{{ obs.id }}</span>
      <mat-icon *ngIf="obs.photos && obs.photos.length > 0" style="margin-left: auto;">photo_library</mat-icon>
  </ion-item>
</ion-list>
