<ion-header translucent>
    <ion-toolbar class="header-slide">
        <ion-title style="text-align: center;">Trait de berge</ion-title>
    </ion-toolbar>
</ion-header>

<div class="has-header" [ngClass]="{'has-fbb-bottom': !tracking && document}" style="padding: 15px;">
    <!-- Tracking actions -->
    <div class="text-center" *ngIf="!tracking && !document">
        <ion-button size="large" color="medium" (click)="startTracking()">
            <span>Commencer</span>
        </ion-button>
    </div>
    <div *ngIf="tracking" fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="10px">
        <ion-button color="medium" (click)="abortTracking()">
            <span>Annuler</span>
        </ion-button>
        <ion-button color="medium" [disabled]="coordinates.length < 2"
                    (click)="(coordinates.length > 1) && stopTracking()">
            <span>Terminer</span>
        </ion-button>
    </div>

    <!-- Tracking message -->
    <p class="tracking-text" *ngIf="tracking">
        Acquisition du tracé GPS... {{coordinates.length}}point(s)
    </p>

    <!-- Document form -->
    <form *ngIf="!tracking && document">
        <div>
            <div>
                <label for="designation">Désignation</label>
                <input id="designation" name="designation" type="text" class="validate" required
                       [(ngModel)]="document.designation"/>
            </div>
        </div>
        <div>
            <div>
                <label for="berge" class="active">Berge</label>
                <select id="berge" name="berge" class="browser-default" required [(ngModel)]="document.bergeId"
                        ng-options="r.id as r.libelle for r in refs.Berge"></select>
            </div>
        </div>
        <div>
            <div>
                <label for="comment">Commentaire</label>
                <textarea id="comment" name="comment" type="text" class="validate"
                          [(ngModel)]="document.commentaire"></textarea>
            </div>
        </div>
        <div>
            <div>
                <label for="dateBegin" class="active">Date début</label>
                <input id="dateBegin" name="dateBegin" type="date" class="datepicker validate"
                       [(ngModel)]="document.date_debut"/>
            </div>
        </div>
        <div>
            <div>
                <label for="dateEnd" class="active">Date fin</label>
                <input id="dateEnd" name="dateEnd" type="date" class="datepicker validate"
                       [(ngModel)]="document.date_fin"/>
            </div>
        </div>
    </form>
</div>

<div *ngIf="!tracking && document"
     fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="10px">
    <!-- Document actions -->
    <ion-button color="medium" (click)="cancelDocument()">
        <span>Annuler</span>
    </ion-button>
    <ion-button color="medium" [disabled]="!document.designation || !document.bergeId" (click)="saveDocument()">
        <span>Valider</span>
    </ion-button>
</div>
